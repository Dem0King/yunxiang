<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3d2b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>云祥家具城 — 产品分类</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-base:16px;
  --space-lg:20px; --space-xl:24px; --space-2xl:32px; --space-3xl:40px;
  --space-4xl:48px; --space-5xl:64px;
  --c-bg:#faf8f5; --c-text:#2c2218; --c-text-muted:#8b7d6b;
  --c-primary:#3d2b1f; --c-secondary:#c89b6f; --c-accent:#d4a574;
  --c-border:#e8e0d5; --c-card-bg:#fff; --c-heading:#6b4423;
  --font-heading:"Songti SC","Noto Serif SC","SimSun",serif;
  --font-body:"PingFang SC","Microsoft YaHei UI","Noto Sans SC",system-ui,sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(61,43,31,.08);
  --shadow-md:0 4px 12px rgba(61,43,31,.1);
  --shadow-lg:0 12px 32px rgba(61,43,31,.15);
  --ease:cubic-bezier(.2,0,0,1);
  --glass-bg:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.45);
  --glass-blur:blur(16px);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);font-size:16px;line-height:1.6;color:var(--c-text);background:var(--c-bg);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

.nav{position:sticky;top:0;z-index:100;padding:var(--space-base) 0;background:rgba(250,248,245,.95);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--c-border)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 var(--space-xl);display:flex;align-items:center;justify-content:space-between}
.nav-back{display:inline-flex;align-items:center;gap:var(--space-sm);padding:8px 16px;border-radius:var(--radius-md);transition:background var(--ease);font-weight:500}
.nav-back:hover{background:rgba(200,155,111,.1)}
.nav-back svg{width:20px;height:20px}
.nav-title{font-family:var(--font-heading);font-size:20px;font-weight:700;color:var(--c-primary)}
.nav-contact{display:inline-flex;align-items:center;gap:var(--space-sm);padding:10px 20px;background:var(--c-primary);color:#fff;border-radius:var(--radius-md);font-size:14px;font-weight:500}
.nav-contact svg{width:16px;height:16px}

.category-hero{padding:var(--space-3xl) 0 var(--space-2xl);text-align:center;background:linear-gradient(135deg,#3d2b1f,#2a1e15);color:#faf8f5}
.category-hero h1{font-family:var(--font-heading);font-size:clamp(28px,5vw,40px);font-weight:700;margin-bottom:var(--space-sm)}
.category-hero p{font-size:16px;opacity:.8}

/* 子分类标签 */
.sub-tabs{display:flex;gap:var(--space-sm);justify-content:center;flex-wrap:wrap;padding:var(--space-xl) var(--space-xl) 0;background:var(--c-bg)}
.sub-tab{padding:8px 20px;border-radius:100px;border:1.5px solid var(--c-border);font-size:14px;font-weight:500;color:var(--c-text-muted);cursor:pointer;transition:all var(--ease);background:#fff}
.sub-tab:hover{border-color:var(--c-secondary);color:var(--c-secondary)}
.sub-tab.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}

.container{max-width:1200px;margin:0 auto;padding:0 var(--space-xl)}
.products-section{padding:var(--space-3xl) 0}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-xl);margin-top:var(--space-2xl)}
@media(min-width:769px){.products-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.products-grid{grid-template-columns:repeat(4,1fr)}}

.product-card{background:var(--c-card-bg);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform var(--ease),box-shadow var(--ease)}
.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.product-card:active{transform:scale(.98)}
.product-img{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,#f0e6d8,#dcc9b3);position:relative;overflow:hidden;cursor:pointer}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-tag{position:absolute;top:var(--space-sm);left:var(--space-sm);font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;background:rgba(200,155,111,.9);color:#fff}
.product-tag.new{background:rgba(22,163,74,.85)}
.product-body{padding:var(--space-lg)}
.product-brand{font-size:12px;color:var(--c-secondary);font-weight:600;margin-bottom:var(--space-xs)}
.product-name{font-family:var(--font-heading);font-size:16px;font-weight:600;color:var(--c-primary);margin-bottom:var(--space-sm)}
.product-desc{font-size:13px;color:var(--c-text-muted);line-height:1.5;margin-bottom:var(--space-base)}
.product-action{display:inline-flex;align-items:center;gap:var(--space-xs);padding:10px 20px;background:var(--c-secondary);color:#fff;border-radius:var(--radius-md);font-size:14px;font-weight:500;width:100%;justify-content:center}
.product-action svg{width:16px;height:16px}

.empty-state{text-align:center;padding:var(--space-5xl) var(--space-xl);color:var(--c-text-muted)}
.empty-state svg{width:64px;height:64px;margin-bottom:var(--space-lg);opacity:.3}
.empty-state h3{font-size:18px;margin-bottom:var(--space-sm);color:var(--c-text)}
.empty-state p{font-size:14px}

.contact-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-top:1px solid var(--c-border);padding:var(--space-md) var(--space-xl);display:flex;gap:var(--space-md);padding-bottom:calc(var(--space-md) + env(safe-area-inset-bottom))}
.contact-bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--space-sm);padding:12px;border-radius:var(--radius-md);font-size:14px;font-weight:600}
.contact-bar .btn-call{background:var(--c-secondary);color:#fff}
.contact-bar .btn-wechat{background:transparent;color:var(--c-primary);border:1.5px solid var(--c-border)}
.contact-bar svg{width:18px;height:18px}
.main-content{padding-bottom:80px}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;display:none;align-items:center;justify-content:center}
.lightbox.active{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}
.lightbox-close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* 管理员添加按钮 */
.admin-add-btn{position:fixed;bottom:80px;right:var(--space-xl);z-index:90;display:flex;align-items:center;gap:var(--space-sm);padding:12px 24px;background:var(--c-secondary);color:#fff;border:none;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(200,155,111,.4)}
.admin-add-btn svg{width:20px;height:20px}
.admin-add-btn:active{transform:scale(.95)}

/* 弹窗表单 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
@media(min-width:769px){.modal-overlay{align-items:center;padding:var(--space-xl)}}
.modal{background:var(--c-bg);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:var(--space-2xl) var(--space-xl) calc(var(--space-2xl) + env(safe-area-inset-bottom));max-width:100%;width:100%;position:relative;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
@media(min-width:769px){.modal{border-radius:var(--radius-xl);max-width:420px;padding:var(--space-3xl)}}
.modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--c-text-muted);cursor:pointer;border:none}
.modal h2{font-family:var(--font-heading);font-size:20px;font-weight:700;color:var(--c-primary);margin-bottom:var(--space-xs)}
.modal p{font-size:13px;color:var(--c-text-muted);margin-bottom:var(--space-lg)}
.form-group{margin-bottom:var(--space-base)}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--c-text);margin-bottom:var(--space-xs)}
.modal-input{width:100%;min-height:44px;border:1.5px solid var(--c-border);border-radius:var(--radius-md);padding:0 var(--space-base);font-size:15px;font-family:var(--font-body);background:#fff}
.modal-input:focus{outline:none;border-color:var(--c-secondary)}
textarea.modal-input{padding:var(--space-sm) var(--space-base);resize:vertical}
.modal-btn{width:100%;height:48px;background:var(--c-primary);color:#fff;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:600;cursor:pointer;margin-top:var(--space-base)}
.modal-btn:active{transform:scale(.97)}
.modal-error{font-size:13px;color:#dc2626;margin-top:var(--space-sm);display:none}
</style>
</head>

<script>
// 品类配置
var categories = {
  sofa: {
    name: '沙发',
    desc: '客厅的核心，家的温度',
    hasSub: true,
    subs: {
      all: { name: '全部沙发', match: function(p) { return p.category === 'sofa'; } },
      wood: { name: '实木沙发', match: function(p) { return p.category === 'sofa' && p.sub === 'wood'; } },
      leather: { name: '软皮沙发', match: function(p) { return p.category === 'sofa' && p.sub === 'leather'; } },
      recliner: { name: '多功能沙发', match: function(p) { return p.category === 'sofa' && p.sub === 'recliner'; } }
    }
  },
  mattress: {
    name: '床垫',
    desc: '喜临门核心品类，健康好睡眠',
    hasSub: false,
    match: function(p) { return p.category === 'mattress'; }
  },
  bed: {
    name: '床',
    desc: '好床，好梦，好日子',
    hasSub: false,
    match: function(p) { return p.category === 'bed'; }
  },
  dining: {
    name: '餐桌',
    desc: '一日三餐，家的团聚',
    hasSub: false,
    match: function(p) { return p.category === 'dining'; }
  },
  wardrobe: {
    name: '衣柜',
    desc: '收纳美好，整理生活',
    hasSub: false,
    match: function(p) { return p.category === 'wardrobe'; }
  }
};

var allProducts = [];
var currentCategory = 'sofa';
var currentSub = 'all';

function getUrlParam(name) {
  var results = new RegExp('[\\?&]' + name + '=([^&#]*)').exec(window.location.href);
  return results ? decodeURIComponent(results[1]) : null;
}

async function loadProducts() {
  currentCategory = getUrlParam('category') || 'sofa';
  currentSub = getUrlParam('sub') || 'all';
  
  var config = categories[currentCategory];
  if (!config) {
    config = categories.sofa;
    currentCategory = 'sofa';
  }

  document.title = '云祥家具城 — ' + config.name;
  document.getElementById('navTitle').textContent = config.name;
  document.getElementById('categoryTitle').textContent = config.name;
  document.getElementById('categoryDesc').textContent = config.desc;

  // 显示/隐藏子分类标签
  var subTabs = document.getElementById('subTabs');
  if (config.hasSub) {
    subTabs.style.display = 'flex';
    // 更新子分类标签状态
    document.querySelectorAll('.sub-tab').forEach(function(tab) {
      tab.classList.toggle('active', tab.dataset.sub === currentSub);
    });
  } else {
    subTabs.style.display = 'none';
  }

  try {
    var r = await fetch('images/products.json?t=' + Date.now());
    if (!r.ok) throw new Error('加载失败');
    var data = await r.json();
    allProducts = data.products || [];
    filterAndRender();
  } catch (e) {
    console.error('加载失败:', e);
    showEmpty();
  }
}

function filterAndRender() {
  var config = categories[currentCategory];
  var products;
  
  if (config.hasSub && config.subs[currentSub]) {
    products = allProducts.filter(config.subs[currentSub].match);
  } else if (config.match) {
    products = allProducts.filter(config.match);
  } else {
    products = [];
  }
  
  renderProducts(products);
}

function renderProducts(products) {
  var grid = document.getElementById('productsGrid');
  var empty = document.getElementById('emptyState');

  if (!products || products.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = products.map(function(p) {
    var tagHtml = p.tag ? '<span class="product-tag' + (p.tagType === 'new' ? ' new' : '') + '">' + p.tag + '</span>' : '';
    var imgHtml = p.image 
      ? '<img src="' + p.image + '" alt="' + p.name + '" loading="lazy">'
      : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--c-text-muted);font-size:14px">暂无图片</div>';
    
    return '<div class="product-card">' +
      '<div class="product-img" onclick="openLightbox(\'' + (p.image || '') + '\')">' +
        imgHtml + tagHtml +
      '</div>' +
      '<div class="product-body">' +
        '<div class="product-brand">' + (p.brand || '') + '</div>' +
        '<h3 class="product-name">' + (p.name || '') + '</h3>' +
        '<p class="product-desc">' + (p.desc || '') + '</p>' +
        '<a href="tel:18177310007" class="product-action">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<span>' + (p.action || '咨询价格') + '</span>' +
        '</a>' +
      '</div>' +
    '</div>';
  }).join('');
}

function showEmpty() {
  document.getElementById('productsGrid').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
}

// 子分类标签点击
document.getElementById('subTabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.sub-tab');
  if (!tab) return;
  
  currentSub = tab.dataset.sub;
  document.querySelectorAll('.sub-tab').forEach(function(t) {
    t.classList.toggle('active', t === tab);
  });
  
  // 更新URL参数
  var url = new URL(window.location);
  url.searchParams.set('sub', currentSub);
  history.replaceState(null, '', url);
  
  filterAndRender();
});

// 灯箱
function openLightbox(url) {
  if (!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('active');
}
document.getElementById('lightboxClose').addEventListener('click', function() {
  document.getElementById('lightbox').classList.remove('active');
});
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('active');
});

// 管理员功能
var GH_OWNER='Dem0King';
var GH_REPO='yunxiang';
var GH_BRANCH='main';
var PRODUCTS_JSON_PATH='images/products.json';
var IMAGES_DIR='images';

function apiURL(p){return 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+p}
function rawURL(p){return 'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+p}
function isLoggedIn(){return!!localStorage.getItem('yxf_gh_token')}

// 显示管理员按钮

// 提交新产品
document.getElementById('addSubmit').addEventListener('click', async function(){
  var name = document.getElementById('addName').value.trim();
  var brand = document.getElementById('addBrand').value.trim();
  var desc = document.getElementById('addDescInput').value.trim();
  var tag = document.getElementById('addTag').value.trim();
  var fileInput = document.getElementById('addImage');
  var errorEl = document.getElementById('addError');
  
  if(!name){
    errorEl.textContent = '请输入产品名称';
    errorEl.style.display = 'block';
    return;
  }
  
  if(!fileInput.files.length){
    errorEl.textContent = '请选择产品图片';
    errorEl.style.display = 'block';
    return;
  }
  
  errorEl.style.display = 'none';
  var btn = document.getElementById('addSubmit');
  btn.textContent = '正在上传...';
  btn.disabled = true;
  
  try {
    var token = localStorage.getItem('yxf_gh_token');
    var headers = {'Authorization': 'token '+token, 'Content-Type': 'application/json'};
    
    // 压缩图片
    var file = fileInput.files[0];
    if(file.size > 300*1024){
      file = await compressImage(file);
    }
    
    // 上传图片
    var fname = 'product_' + Date.now() + '.jpg';
    var dataURL = await readAsDataURL(file);
    var base64 = dataURL.split(',')[1];
    
    var r1 = await fetch(apiURL(IMAGES_DIR+'/'+fname), {
      method: 'PUT',
      headers: headers,
      body: JSON.stringify({message: '添加产品图片: '+fname, content: base64, branch: GH_BRANCH})
    });
    if(!r1.ok) throw new Error('图片上传失败');
    var d1 = await r1.json();
    var imageUrl = rawURL(IMAGES_DIR+'/'+fname)+'?t='+Date.now();
    
    // 加载当前产品数据（使用API避免CDN缓存）
    var productsData = {products:[], brands:[]};
    try {
      var r0 = await fetch(apiURL(PRODUCTS_JSON_PATH)+'?ref='+GH_BRANCH, {headers:headers});
      if(r0.ok){
        var d0 = await r0.json();
        productsData = JSON.parse(decodeURIComponent(escape(atob(d0.content.replace(/\s/g,'')))));
      }
    } catch(e){}
    
    // 创建新产品，自动设置分类
    var newProduct = {
      id: 'p' + Date.now(),
      brand: brand || '云祥家具城',
      name: name,
      desc: desc || '',
      tag: tag || '',
      tagType: tag === '新品' ? 'new' : '',
      action: '咨询价格',
      category: currentCategory,  // 自动设置当前品类
      sub: currentSub !== 'all' ? currentSub : '',  // 自动设置子分类
      image: imageUrl
    };
    
    productsData.products.push(newProduct);
    
    // 保存产品数据
    var curSha = null;
    try {
      var rc = await fetch(apiURL(PRODUCTS_JSON_PATH)+'?ref='+GH_BRANCH, {headers:headers});
      if(rc.ok){var cd = await rc.json(); curSha = cd.sha;}
    } catch(e){}
    
    var r2 = await fetch(apiURL(PRODUCTS_JSON_PATH), {
      method: 'PUT',
      headers: headers,
      body: JSON.stringify({
        message: '添加产品: ' + name,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(productsData, null, 2)))),
        branch: GH_BRANCH,
        sha: curSha
      })
    });
    if(!r2.ok) throw new Error('保存失败');
    
    // 本地备份
    try{localStorage.setItem('yxf_local_site', JSON.stringify(productsData))}catch(e){}
    
    // 成功
    document.getElementById('addModal').classList.remove('active');
    alert('产品添加成功！页面将刷新显示。');
    location.reload();
    
  } catch(e) {
    errorEl.textContent = '失败: ' + e.message;
    errorEl.style.display = 'block';
  } finally {
    btn.textContent = '添加产品';
    btn.disabled = false;
  }
});

// 图片压缩
function compressImage(file){
  return new Promise(function(resolve){
    if(file.size < 300*1024){resolve(file);return}
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.width, h = img.height;
      var maxW = 1200;
      if(w > maxW){h = Math.round(h*maxW/w); w = maxW}
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob){
        resolve(new File([blob], file.name, {type:'image/jpeg'}));
      }, 'image/jpeg', 0.8);
    };
    img.src = url;
  });
}

function readAsDataURL(f){
  return new Promise(function(r,j){
    var rd = new FileReader();
    rd.onload = function(){r(rd.result)};
    rd.onerror = j;
    rd.readAsDataURL(f);
  });
}
